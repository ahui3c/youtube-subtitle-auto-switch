<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Youtube 字幕全自動開關</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div>
        <p class="eyebrow">FULL AUTO CAPTION CONTROL</p>
        <h1>Youtube 字幕全自動開關</h1>
      </div>
      <label class="master-switch">
        <input id="enabled" type="checkbox">
        <span aria-hidden="true"></span>
        <b>啟用</b>
      </label>
    </header>

    <section class="now-playing" aria-labelledby="now-title">
      <div class="signal" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <div>
        <p id="now-title">目前字幕路徑</p>
        <strong id="route-status">等待 YouTube 影片</strong>
        <small id="route-detail">開啟影片後會自動套用規則</small>
      </div>
    </section>

    <section class="section" aria-labelledby="priority-title">
      <div class="section-heading">
        <div>
          <p class="kicker">由上往下尋找</p>
          <h2 id="priority-title">字幕優先順序</h2>
        </div>
        <span id="track-count" class="count">7/7 軌</span>
      </div>
      <ol id="priority-list" class="track-list"></ol>
    </section>

    <section class="section compact" aria-labelledby="conversion-title">
      <div class="section-heading">
        <div>
          <p class="kicker">只有簡體字幕時</p>
          <h2 id="conversion-title">簡轉繁方式</h2>
        </div>
      </div>
      <div class="segmented" role="radiogroup" aria-label="簡轉繁方式">
        <label><input type="radio" name="simplifiedMode" value="opencc"><span>本機轉換</span></label>
        <label><input type="radio" name="simplifiedMode" value="youtube"><span>YouTube 翻譯</span></label>
      </div>
      <p id="simplified-hint" class="hint">本機轉換不會送出字幕文字，並保留原始時間軸。</p>
    </section>

    <section class="section compact detector" aria-labelledby="detector-title">
      <div class="detector-row">
        <div>
          <p class="kicker">實驗性功能</p>
          <h2 id="detector-title">偵測畫面內嵌字幕</h2>
        </div>
        <label class="inline-switch">
          <input id="embeddedDetection" type="checkbox">
          <span aria-hidden="true"></span>
        </label>
      </div>
      <p class="hint">只在 CC 出現有效文字時取樣。功能開啟後會自動擷取目前正在播放的 YouTube 分頁，不必開啟此面板。</p>
      <div id="detector-status" class="detector-status">尚未取樣</div>
    </section>

    <footer>
      <button id="reapply" class="primary" type="button">套用到目前影片</button>
      <span id="save-status" role="status">設定會自動儲存</span>
    </footer>
  </main>
  <script src="preview-shim.js"></script>
  <script src="core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
