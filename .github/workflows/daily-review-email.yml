name: Daily order review email

on:
  schedule:
    # Cloudflare Worker 是主要排程；GitHub Actions 從台灣時間 11:07 起擔任備援。
    # GitHub 排程可能延遲或被略過，因此保留多個補救時段。
    # 網站端以日期 run_key 保證同一天只會寄出一封，不會因重試而重複寄送。
    - cron: "7,37 3-5 * * *"
    - cron: "7 6-8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-order-review-email
  cancel-in-progress: false

jobs:
  send-review-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request daily review digest
        env:
          DAILY_REVIEW_CRON_SECRET: ${{ secrets.DAILY_REVIEW_CRON_SECRET }}
        run: |
          test -n "$DAILY_REVIEW_CRON_SECRET"
          curl --fail-with-body --retry 2 --retry-all-errors \
            --connect-timeout 15 \
            --max-time 90 \
            --request POST \
            --header "Authorization: Bearer $DAILY_REVIEW_CRON_SECRET" \
            --header "Content-Type: application/json" \
            https://myapp.ahui3c.com/api/cron/daily-review-email
